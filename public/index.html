<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F4F6FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="愉阅">
<link rel="manifest" href='data:application/manifest+json,{"name":"愉阅 · 纯净阅读器","short_name":"愉阅","start_url":".","display":"standalone","background_color":"%23F3F5FB","theme_color":"%23274AFF"}'>
<title>愉阅 · 纯净阅读器</title>
<style>
/* ==========================================================================
   愉阅 · 设计令牌
   参考「必访」的配色（主色 #274AFF）与信息结构，重绘为浅色阅读类 App。
   ========================================================================== */
:root{
  --brand:#274AFF;
  --brand-2:#5B78FF;
  --brand-soft:#E9EEFF;
  --bg:#F3F5FB;
  --card:#FFFFFF;
  --text:#111629;
  --sub:#5C6480;
  --muted:#9AA1B8;
  --line:#EBEEF7;
  --gold:#FF8A2B;
  --gold-2:#FF5A3C;
  --radius:18px;
  --shadow:0 8px 24px rgba(23,38,90,.07);
  --shadow-sm:0 2px 10px rgba(23,38,90,.05);
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  font-synthesis-weight:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:
    radial-gradient(900px 500px at 15% -10%, #E7EDFF 0%, transparent 60%),
    radial-gradient(700px 400px at 95% 0%, #FFE9DE 0%, transparent 55%),
    #EEF1F9;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:inherit}
img{display:block}
::selection{background:#C9D5FF}

/* ---------- 手机画布：移动端满屏，桌面端居中一台“手机” ---------- */
.app{
  position:relative;width:100%;max-width:440px;margin:0 auto;height:100%;min-height:100%;
  background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
}
@media (min-width:760px){
  body{display:flex;align-items:center;justify-content:center;padding:24px 0}
  .app{
    height:min(920px,calc(100vh - 48px));min-height:640px;border-radius:34px;
    box-shadow:0 40px 90px rgba(20,32,74,.22), 0 2px 0 #fff inset;
    border:1px solid rgba(255,255,255,.7);
  }
}

/* ---------- 顶部状态栏（仅桌面展示氛围） ---------- */
.screen{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}

/* ==========================================================================
   通用组件
   ========================================================================== */
.bar{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:rgba(243,245,251,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;
}
.bar.solid{border-bottom-color:var(--line)}
.bar .title{font-size:17px;font-weight:700;letter-spacing:.2px}
.icon-btn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--text)}
.icon-btn:active{background:#E7EBF8}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.ico.sm{width:16px;height:16px}
.ico.lg{width:26px;height:26px}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 16px}

.chip{
  display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 12px;border-radius:999px;
  background:#fff;border:1px solid var(--line);color:var(--sub);font-size:12.5px;white-space:nowrap;
}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.chip.soft{background:var(--brand-soft);border-color:transparent;color:#2B3EA8}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;
  border-radius:14px;font-size:15px;font-weight:600;transition:transform .12s ease;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#3A5BFF,#274AFF);color:#fff;box-shadow:0 10px 22px rgba(39,74,255,.28)}
.btn.ghost{background:#EEF2FF;color:var(--brand)}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--text)}
.btn.gold{background:linear-gradient(135deg,#FFB03A,#FF7A2F);color:#fff;box-shadow:0 10px 22px rgba(255,138,43,.28)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;background:var(--brand-soft);color:#3B54C9;font-size:11px}
.tag.green{background:#E4F7EC;color:#128A4B}
.tag.orange{background:#FFF0E4;color:#D9660E}
.divider{height:1px;background:var(--line);margin:14px 0}

/* 封面：用渐变 + 竖排书名生成，无需外部图片，离线可用 */
.cover{
  position:relative;border-radius:10px;overflow:hidden;flex:none;
  background:linear-gradient(150deg,var(--c1),var(--c2));
  box-shadow:0 8px 18px rgba(20,30,70,.14);
  display:flex;align-items:center;justify-content:center;
}
.cover::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(255,255,255,.28) 0 6px,transparent 6px),
    radial-gradient(120% 80% at 20% 0%,rgba(255,255,255,.32),transparent 55%),
    repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 6px);
  pointer-events:none;
}
.cover b{
  position:relative;z-index:1;writing-mode:vertical-rl;letter-spacing:3px;
  color:rgba(255,255,255,.95);font-size:13px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.25);
}
.cover.sm{width:52px;height:70px}
.cover.md{width:66px;height:90px}
.cover.lg{width:104px;height:142px;border-radius:12px}
.cover.lg b{font-size:16px;letter-spacing:4px}

/* ==========================================================================
   底部导航
   ========================================================================== */
.tabbar{
  position:relative;flex:none;display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 0 calc(6px + var(--safe-b));
  background:rgba(255,255,255,.94);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
}
.tabbar .tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:5px;color:#98A0B8;font-size:11px;font-weight:500}
.tabbar .tab .ico{width:22px;height:22px}
.tabbar .tab.on{color:var(--brand);font-weight:700}

/* ==========================================================================
   首页 / 发现
   ========================================================================== */
.home-head{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0}
.brandline{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.logo{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
  background:linear-gradient(140deg,#4C6BFF,#1D3BE0);box-shadow:0 6px 14px rgba(39,74,255,.28);
}
.brandline .name{font-size:18px;font-weight:800;letter-spacing:.6px}
.brandline .sub{font-size:11px;color:var(--muted);margin-left:2px;align-self:flex-end;padding-bottom:2px}
.brandline .right{margin-left:auto;display:flex;gap:2px}

.searchbar{display:flex;align-items:center;gap:8px;height:46px;padding:0 6px 0 14px;border-radius:14px;background:#fff;box-shadow:var(--shadow-sm);border:1.5px solid #DDE4FF}
.searchbar input{flex:1;border:none;outline:none;background:none;font-size:14px;min-width:0}
.searchbar input::placeholder{color:#A9B0C6}
.searchbar .go{height:34px;padding:0 14px;border-radius:10px;background:linear-gradient(135deg,#3A5BFF,#274AFF);color:#fff;font-size:13px;font-weight:700}
.searchbar .go:active{opacity:.85}

.tabs{display:flex;gap:22px;padding:14px 2px 8px;font-size:15px;color:#7C8399;font-weight:600}
.tabs .t{position:relative;padding:2px 0}
.tabs .t.on{color:var(--text);font-size:16px;font-weight:800}
.tabs .t.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-6px;width:16px;height:3px;border-radius:3px;background:var(--brand)}

.sect{margin-top:14px}
.sect-head{display:flex;align-items:center;gap:8px;padding:0 2px 10px}
.sect-head .ico{color:var(--brand)}
.sect-head h3{margin:0;font-size:15px;font-weight:800}
.sect-head .more{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:2px}

.rank-tabs{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.rank-tabs::-webkit-scrollbar{display:none}
.rank-tabs .r{flex:none;height:30px;padding:0 14px;border-radius:8px;background:#EDF1FF;color:#4B5A86;font-size:12.5px;display:flex;align-items:center}
.rank-tabs .r.on{background:linear-gradient(135deg,#E6ECFF,#DDE3FF);color:#1B3084;font-weight:800;box-shadow:inset 0 0 0 1px #C9D5FF}

.rank-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.rank-item{display:flex;gap:9px;align-items:flex-start}
.rank-item .meta{min-width:0;display:flex;flex-direction:column;gap:5px}
.rank-item .nm{font-size:13.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rank-item .au{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.topic-wrap{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm)}
.topic-chips{display:flex;flex-wrap:wrap;gap:9px}
.topic-chips .tp{padding:7px 11px;border-radius:9px;background:#F5F8FF;border:1px solid #E2E9FF;color:#3F4E7A;font-size:12px}
.topic-chips .tp b{color:var(--brand);font-weight:800;margin-right:2px}

.rc-list{display:flex;flex-direction:column;gap:10px}
.rc{display:flex;gap:12px;padding:12px;background:#fff;border-radius:16px;box-shadow:var(--shadow-sm)}
.rc .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rc .t{font-size:14px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc .d{font-size:11.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.6}
.rc .foot{display:flex;align-items:center;gap:6px;margin-top:auto}

/* ==========================================================================
   搜索
   ========================================================================== */
.result-note{text-align:center;font-size:12px;color:var(--brand);padding:10px 0 14px;font-weight:600}
/* 搜索空结果 / 版权提示 */
.notice{margin:0 0 12px;padding:14px 14px 12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow-sm);border-left:3px solid var(--brand)}
.notice .nt{font-size:13.5px;font-weight:800;margin-bottom:6px}
.notice .nd{font-size:12px;color:var(--sub);line-height:1.75}
.notice .nacts{display:flex;gap:8px;margin-top:12px}
.notice .nacts .btn{height:34px;padding:0 14px;font-size:12px;border-radius:10px}
.notice.rights{border-left-color:#E0A23A;background:#FFFCF4}
body.dark .notice.rights{background:#231D12}
body.dark .notice .nd{color:#A7AEC4}
.libmeta{font-size:11px;color:var(--muted);align-self:center}

/* --- 书源版新增：在线结果卡 / 骨架屏 / 书源行 --- */
.lv-card{display:flex;gap:12px;padding:12px;background:#fff;border-radius:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(20,30,60,.05)}
.lv-card .cv{width:56px;height:76px;border-radius:8px;flex:none;background:linear-gradient(135deg,#3A4A7A,#7C8FF0);display:grid;place-items:center;color:#fff;font-size:11px;overflow:hidden;text-align:center}
.lv-card .cv img{width:100%;height:100%;object-fit:cover;display:block}
.lv-card .info{flex:1;min-width:0}
.lv-card h4{font-size:14.5px;margin:0 0 4px;color:var(--text)}
.lv-card h4 em{font-style:normal;color:#E0402B;font-weight:800}
.lv-card .au{font-size:11.5px;color:var(--muted)}
.lv-card .in{font-size:11.5px;color:#5A6379;line-height:1.65;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lv-card .ft{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.skel{height:96px;border-radius:14px;background:linear-gradient(90deg,#EDF0F7,#F8FAFD,#EDF0F7);background-size:200% 100%;animation:sk 1.1s linear infinite;margin-bottom:10px}
@keyframes sk{0%{background-position:0 0}100%{background-position:200% 0}}
.src-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:#fff;margin-bottom:8px;box-shadow:0 1px 6px rgba(20,30,60,.04)}
.src-row .dot{width:8px;height:8px;border-radius:50%;flex:none}
.src-row .nm{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-row .hs{font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-row .st{font-size:10px;padding:2px 7px;border-radius:20px;flex:none}
body.dark .lv-card{background:#171B29;box-shadow:none}
body.dark .lv-card .in{color:#A7AEC4}
body.dark .skel{background:linear-gradient(90deg,#1B2030,#232941,#1B2030);background-size:200% 100%}
body.dark .src-row{background:#171B29;box-shadow:none}
.res-card{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.res-card h4{margin:0 0 8px;font-size:15px;font-weight:700;line-height:1.45;color:#1A2338}
.res-card h4 em{color:#E43D3D;font-style:normal}
.res-card .row{font-size:12.5px;color:var(--sub);line-height:1.75}
.res-card .row b{color:#8B93A8;font-weight:500}
.res-card .intro{font-size:12.5px;color:#5C6480;line-height:1.7;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.res-card .foot{display:flex;align-items:center;gap:8px;margin-top:10px}
.res-card .host{font-size:11px;color:#C3C8D8;filter:blur(2.5px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-card .enter{margin-left:auto;font-size:12px;color:var(--brand);font-weight:700;white-space:nowrap}

.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:56px 24px;color:var(--muted);font-size:13px;text-align:center}
.empty .big{font-size:34px}

/* ==========================================================================
   书籍详情
   顶部用封面主色作为渐变背景，形成沉浸式色块
   ========================================================================== */
.detail-hero{position:relative;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 22px;color:#fff;overflow:hidden}
.detail-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),var(--c2));opacity:.92}
.detail-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 80% 0%,rgba(255,255,255,.3),transparent 60%)}
.detail-hero>*{position:relative;z-index:1}
.detail-hero .nav{display:flex;align-items:center;margin-bottom:18px}
.detail-hero .nav .icon-btn{color:#fff;background:rgba(255,255,255,.16);backdrop-filter:blur(6px)}
.detail-hero .nav .spacer{flex:1}
.detail-main{display:flex;gap:16px}
.detail-main .cover{box-shadow:0 16px 30px rgba(0,0,0,.28)}
.detail-main .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.detail-main h2{margin:0;font-size:20px;line-height:1.35;font-weight:800}
.detail-main .a{font-size:12.5px;opacity:.85}
.detail-main .badges{display:flex;gap:6px;flex-wrap:wrap}
.detail-main .badges span{padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.2);font-size:11px}
.detail-stats{display:flex;gap:22px;margin-top:14px;font-size:11px;opacity:.9}
.detail-stats b{display:block;font-size:16px;font-weight:800;margin-bottom:2px}
.detail-body{padding:16px}
.intro-card{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow-sm)}
/* 离线缓存卡片 */
.dl-card{background:#fff;border-radius:16px;padding:13px 14px 12px;box-shadow:var(--shadow-sm);margin-top:12px;
  display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center}
.dl-card b{font-size:13.5px;display:block;margin-bottom:3px}
.dl-card #dl-sub{font-size:11.5px;color:var(--muted);line-height:1.5}
.dl-card .btn{padding:7px 13px;font-size:12px;border-radius:10px;white-space:nowrap}
.dl-card .btn[disabled]{opacity:.6}
#dl-barwrap{grid-column:1 / -1;height:4px;border-radius:4px;background:#EEF1F8;overflow:hidden;display:none}
#dl-bar{display:block;height:100%;width:0;background:var(--brand);border-radius:4px;transition:width .3s}
body.dark .dl-card{background:#1B1F2C;box-shadow:none}
body.dark #dl-barwrap{background:#2A2F40}
/* 目录还没读到时的不确定进度：来回滑动的小光条 */
#dl-barwrap.indet #dl-bar{width:38% !important;animation:dlSlide 1.1s ease-in-out infinite}
@keyframes dlSlide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.intro-card .h{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:8px}
.intro-card p{margin:0;font-size:13px;line-height:1.85;color:#4E5670;text-align:justify}
.intro-card p.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.catalog{background:#fff;border-radius:16px;margin-top:12px;padding:14px;box-shadow:var(--shadow-sm)}
.catalog .h{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:6px}
.catalog .ch{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #F3F5FB;font-size:13px;color:#3A4159}
.catalog .ch:last-child{border-bottom:none}
.catalog .ch .n{display:flex;align-items:center;gap:8px;min-width:0}
.catalog .ch .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catalog .ch .free{font-size:10.5px;color:#1B9A57;background:#E9F9EF;padding:2px 5px;border-radius:5px;flex:none}
.detail-actions{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 16px calc(12px + var(--safe-b));background:linear-gradient(to top,#fff 60%,rgba(255,255,255,0));}

/* ==========================================================================
   阅读器
   ========================================================================== */
.reader{position:absolute;inset:0;z-index:40;background:var(--rp-bg);color:var(--rp-fg);display:flex;flex-direction:column;transition:background .25s}
.reader-head{
  display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px;
  font-size:12px;color:var(--rp-fg);opacity:.9;position:relative;z-index:2;
}
.reader-head .icon-btn{width:32px;height:32px;color:var(--rp-fg)}
.reader-head .tt{flex:1;text-align:center;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-body{
  flex:1;overflow-y:auto;padding:10px 22px 28px;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"Microsoft YaHei",serif;
}
.reader-body::-webkit-scrollbar{display:none}
.reader-body .ch-title{font-size:calc(var(--fs) + 3px);font-weight:800;margin:6px 0 18px;letter-spacing:.5px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.reader-body p{
  margin:0 0 calc(var(--lh) * 1em);font-size:var(--fs);line-height:var(--lh);
  text-align:justify;text-indent:2em;letter-spacing:.02em;
}
.reader-body p.hl{background:rgba(255,214,102,.45);border-radius:4px;transition:background .3s}
/* 连续阅读：多章串成一屏，章与章之间用细线分隔 */
.rd-ch{padding-bottom:2px}
.rd-ch + .rd-ch{border-top:1px solid rgba(140,140,140,.18);margin-top:26px;padding-top:20px}
.rd-ch + .rd-ch .ch-title{margin-top:0;font-size:calc(var(--fs) + 1px)}
.rd-loading{padding:26px 0;text-align:center;font-size:12.5px;opacity:.7}
#rd-tail-note{text-align:center;font-size:12px;opacity:.55;margin:24px 0 12px}
.reader-dim{position:absolute;inset:0;background:#000;pointer-events:none;opacity:var(--dim,0);z-index:3;transition:opacity .2s}
.reader-foot{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 18px calc(10px + var(--safe-b));font-size:11px;color:var(--rp-fg);opacity:.72;
  background:linear-gradient(to top,var(--rp-bg) 55%,transparent);
}
.progress{flex:1;height:3px;border-radius:3px;background:rgba(120,120,120,.22);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--brand);border-radius:3px;transition:width .2s}

/* 阅读器底部面板与遮罩 */
.sheet-mask{position:absolute;inset:0;background:rgba(12,16,32,.35);z-index:41;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:42;background:#fff;color:var(--text);
  border-radius:22px 22px 0 0;padding:16px 16px calc(16px + var(--safe-b));
  transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  max-height:82%;overflow-y:auto;
}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:36px;height:4px;border-radius:4px;background:#E6E9F3;margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.sheet h3 .close{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}

.setting-row{display:flex;align-items:center;gap:12px;padding:11px 0;font-size:13px;color:#4C5468}
.setting-row .lab{width:38px;flex:none;color:#8B93A8}
.stepper{display:flex;align-items:center;gap:0;background:#F2F4FA;border-radius:10px;height:34px;flex:1}
.stepper button{width:40px;height:100%;font-size:18px;color:#6B7490}
.stepper .v{flex:1;text-align:center;font-size:13px;font-weight:700;color:#2C3450}
.range{flex:1;-webkit-appearance:none;height:26px;background:none}
.range::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:#E3E8F5}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--brand);margin-top:-8px;box-shadow:0 2px 6px rgba(39,74,255,.3)}
.theme-row{display:flex;gap:8px;margin-top:6px}
.theme-row .th{flex:1;height:44px;border-radius:11px;display:grid;place-items:center;font-size:12px;border:1.5px solid transparent}
.theme-row .th.on{border-color:var(--brand);box-shadow:0 0 0 3px rgba(39,74,255,.12)}
.theme-row .th[data-th="white"]{background:#FBFAF6;color:#333}
.theme-row .th[data-th="paper"]{background:#F6E9CE;color:#6B5233}
.theme-row .th[data-th="green"]{background:#E3F0DE;color:#3A5232}
.theme-row .th[data-th="night"]{background:#15161A;color:#B9BECB}

/* 听书条 */
.tts-bar{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:#F4F7FF}
.tts-bar .wave{display:flex;gap:3px;align-items:flex-end;height:16px}
.tts-bar .wave i{width:3px;background:var(--brand);border-radius:3px;animation:wave 1s infinite ease-in-out}
.tts-bar .wave i:nth-child(2){animation-delay:.15s}
.tts-bar .wave i:nth-child(3){animation-delay:.3s}
.tts-bar .wave i:nth-child(4){animation-delay:.45s}
@keyframes wave{0%,100%{height:5px}50%{height:15px}}
.tts-bar.paused .wave i{animation-play-state:paused;height:6px}

/* 夜间主题下的设置面板：避免白底刺眼 */
.reader.rd-night .sheet{background:#16181F;color:#E9ECF5}
.reader.rd-night .sheet .grab{background:#2A2F40}
.reader.rd-night .setting-row{color:#A7AEC4}
.reader.rd-night .setting-row .lab{color:#7A839B}
.reader.rd-night .stepper{background:#222635}
.reader.rd-night .stepper .v{color:#E9ECF5}
.reader.rd-night .stepper button{color:#9AA3BC}
.reader.rd-night .rate{background:#222635}
.reader.rd-night .theme-row .th{border-color:transparent}
.reader.rd-night .tts-bar{background:#1D2130}
.reader.rd-night .tts-bar div[style]{color:#9AA3BC}
.reader.rd-night .site-note{background:#232838;border-color:#323A50;color:#98A2BC}
.reader.rd-night .site-note .lb{background:#323A50;color:#B7C0D6}
.reader.rd-night .site-nav{color:#98A2BC;border-bottom-color:#2A2F40}
.reader.rd-night .site-rec{background:#232838;color:#98A2BC}
.reader.rd-night .ch{border-bottom-color:#242A3A !important}

/* 关闭纯净模式时，展示「原网页」自带的导航/推荐位（中性灰，无广告） */
.site-note{position:relative;margin:0 0 14px;padding:10px 58px 10px 12px;border-radius:12px;background:#F2F4F9;border:1px dashed #D5DBE8;font-size:11.5px;color:#6C7488;line-height:1.6}
.site-note .lb{position:absolute;right:8px;top:6px;font-size:9px;padding:1px 5px;border-radius:4px;background:#E3E7F0;color:#6C7488}
.site-nav{display:flex;align-items:center;gap:14px;font-size:11px;color:#6C7488;margin:-2px 0 16px;padding:8px 0 10px;border-bottom:1px solid #E7EAF1}
.site-nav .sp{flex:1}
.site-nav .s{opacity:.7}
.site-rec{margin:18px 0;padding:14px;border-radius:12px;background:#F2F4F9;font-size:12px;color:#6C7488;display:flex;align-items:center;gap:10px}
.site-rec .blk{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#C9D0E0,#AEB8CE);flex:none}

/* ==========================================================================
   书架
   ========================================================================== */
.shelf-head{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px}
.shelf-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:.4px}
.shelf-tools{display:flex;align-items:center;gap:6px;margin-left:auto}
.shelf-tools .icon-btn{background:#fff;border-radius:10px;box-shadow:var(--shadow-sm)}
.shelf-sort{display:flex;gap:16px;padding:0 16px 8px;font-size:12px;color:var(--muted)}
.shelf-sort .s.on{color:var(--brand);font-weight:700}

.shelf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 14px;padding:8px 16px 20px}
.shelf-grid .it{display:flex;flex-direction:column;gap:7px}
.shelf-grid .cover{width:100%;aspect-ratio:3/4;height:auto;border-radius:11px}
.shelf-grid .cover b{font-size:14px}
.shelf-grid .nm{font-size:12.5px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shelf-grid .pg{font-size:10.5px;color:var(--muted)}
.shelf-grid .it .newdot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:#FF4D4F;box-shadow:0 0 0 2px rgba(255,255,255,.7)}

.continue{display:flex;gap:12px;margin:0 16px 6px;padding:12px;border-radius:16px;background:linear-gradient(135deg,#EFF3FF,#E6EBFF);box-shadow:inset 0 0 0 1px #DCE4FF}
.continue .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
.continue .t{font-size:13px;font-weight:800}
.continue .s{font-size:11px;color:#66719A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.continue .btn{height:34px;padding:0 14px;border-radius:10px;font-size:12px}

/* ==========================================================================
   社区
   ========================================================================== */
.com-page{background:linear-gradient(180deg,#EEF2FF 0%,#F5F7FE 26%,var(--bg) 46%)}
.com-head{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;gap:10px}
.com-head h2{margin:0;font-size:19px;font-weight:800}
.com-head .icon-btn{margin-left:auto;background:#fff;border-radius:10px;box-shadow:var(--shadow-sm)}
.com-tabs{display:flex;gap:18px;padding:6px 16px 10px;font-size:14px;color:#7C8399;font-weight:600}
.com-tabs .t.on{color:var(--text);font-weight:800;position:relative}
.com-tabs .t.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-6px;width:14px;height:3px;border-radius:3px;background:var(--brand)}

.post{background:#fff;border-radius:18px;padding:14px;margin:0 16px 12px;box-shadow:var(--shadow-sm)}
.post-hd{display:flex;align-items:center;gap:9px}
.ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;flex:none;background:linear-gradient(135deg,#7E96FF,#4B5FE0)}
.post-hd .who{flex:1;min-width:0}
.post-hd .nm{font-size:12.5px;font-weight:700}
.post-hd .tm{font-size:10.5px;color:var(--muted);margin-top:2px}
.post-hd .follow{font-size:11px;color:var(--brand);border:1px solid #D8E0FF;border-radius:999px;padding:3px 9px}
.post-body{font-size:13.5px;line-height:1.8;color:#333B52;margin:10px 0 0;white-space:pre-wrap;text-align:justify}
.post-topic{display:inline-block;margin-top:9px;font-size:11.5px;color:#3A56C8;background:#EDF1FF;border-radius:6px;padding:3px 8px}
.post-acts{display:flex;align-items:center;gap:20px;margin-top:12px;font-size:11.5px;color:#8B93A8}
.post-acts .a{display:flex;align-items:center;gap:5px}
.post-acts .a.on{color:#FF5A3C}
.post-acts .a.on .ico{stroke:#FF5A3C}

.com-fab{position:absolute;right:16px;bottom:calc(var(--nav-h) + 18px + var(--safe-b));width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#5B7BFF,#274AFF);color:#fff;box-shadow:0 12px 24px rgba(39,74,255,.34);z-index:6}

/* 评论 */
.cmt{display:flex;gap:9px;padding:12px 0;border-bottom:1px solid #F4F6FB}
.cmt:last-child{border-bottom:none}
.cmt .tx{flex:1;min-width:0}
.cmt .nm{font-size:12px;font-weight:700;color:#4A5470}
.cmt .c{font-size:13px;line-height:1.7;color:#2C3450;margin-top:4px}
.cmt .tm{font-size:10.5px;color:var(--muted);margin-top:6px}

/* ==========================================================================
   我的
   ========================================================================== */
.me-hero{padding:calc(16px + env(safe-area-inset-top,0px)) 16px 20px;background:linear-gradient(150deg,#3B5BFF,#274AFF 60%,#5B3BFF);color:#fff;border-radius:0 0 24px 24px}
.me-top{display:flex;align-items:center;gap:12px}
.me-ava{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:22px;border:2px solid rgba(255,255,255,.45)}
.me-top .info{flex:1;min-width:0}
.me-top .nm{font-size:17px;font-weight:800}
.me-top .ds{font-size:11.5px;opacity:.8;margin-top:4px}
.me-top .icon-btn{color:#fff}
.me-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;text-align:center}
.me-stats b{display:block;font-size:18px;font-weight:800}
.me-stats span{font-size:11px;opacity:.78}
.me-list{margin:14px 16px;background:#fff;border-radius:18px;box-shadow:var(--shadow-sm);overflow:hidden}
.me-row{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #F4F6FB;font-size:13.5px}
.me-row:last-child{border-bottom:none}
.me-row .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#EFF3FF;color:var(--brand);flex:none}
.me-row .tx{flex:1;min-width:0}
.me-row .tx .s{font-size:11px;color:var(--muted);margin-top:2px}
.me-row .v{font-size:12.5px;color:var(--muted)}
.me-row .chev{color:#C6CCDD}
.me-row:active{background:#FAFBFF}
.switch{width:42px;height:24px;border-radius:999px;background:#E4E8F3;position:relative;transition:background .2s;flex:none}
.switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.16);transition:transform .2s}
.switch.on{background:var(--brand)}
.switch.on i{transform:translateX(18px)}

/* 通用弹层 / 抽屉 / toast */
.modal-mask{position:absolute;inset:0;z-index:50;background:rgba(10,15,30,.4);opacity:0;pointer-events:none;transition:opacity .2s}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);z-index:51;width:calc(100% - 48px);max-width:340px;background:#fff;border-radius:20px;padding:20px;opacity:0;pointer-events:none;transition:all .22s cubic-bezier(.2,.8,.2,1)}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal h4{margin:0 0 8px;font-size:16px;font-weight:800;text-align:center}
.modal p{margin:0;font-size:13px;line-height:1.7;color:#5C6480;text-align:center}
.modal .acts{display:flex;gap:10px;margin-top:18px}
.modal .acts .btn{flex:1;height:40px;font-size:14px;border-radius:12px}

.toast{position:absolute;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,10px);z-index:60;background:rgba(20,26,44,.9);color:#fff;font-size:12.5px;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s;max-width:80%;text-align:center;backdrop-filter:blur(6px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.drawer{position:absolute;inset:0;z-index:45;pointer-events:none}
.drawer .mask{position:absolute;inset:0;background:rgba(10,15,30,.35);opacity:0;transition:opacity .2s}
.drawer .panel{position:absolute;left:0;top:0;bottom:0;width:78%;max-width:320px;background:#fff;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.drawer.show{pointer-events:auto}
.drawer.show .mask{opacity:1}
.drawer.show .panel{transform:translateX(0)}
.drawer .panel h3{margin:0;padding:0 16px 12px;font-size:15px;font-weight:800;display:flex;align-items:center}
.drawer .panel .list{flex:1;overflow-y:auto}

/* 导入 / 发帖表单 */
.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;background:#FAFBFF;outline:none;resize:vertical}
.field:focus{border-color:#BFCBFF;background:#fff}
.form-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}

/* 页脚安全区 */
.spacer-b{height:calc(18px + var(--safe-b))}

/* 夜间模式（全局，阅读器另有主题） */
body.dark{--bg:#0E1016;--card:#171A22;--text:#EDEFF7;--sub:#A7AEC4;--muted:#727A92;--line:#242836;--brand-soft:#232A44;--shadow:0 8px 24px rgba(0,0,0,.3);--shadow-sm:0 2px 10px rgba(0,0,0,.25)}
body.dark .bar,body.dark .tabbar{background:rgba(14,16,22,.85)}
body.dark .searchbar{background:#171A22;border-color:#2A3050}
body.dark .post-body{color:#C3C9DB}
body.dark .post-topic{background:#232A44;color:#A9B6E8}
body.dark .rc,body.dark .res-card,body.dark .intro-card,body.dark .catalog,body.dark .post,body.dark .me-list,body.dark .topic-wrap{background:var(--card)}
body.dark .shelf-tools .icon-btn,body.dark .com-head .icon-btn{background:#171A22}
body.dark .sheet{background:#171A22}
body.dark .stepper,body.dark .tts-bar{background:#222635}
body.dark .sheet .grab{background:#2A2F40}
body.dark .sign7 .d{background:#1D2130;color:#8A93AB}
body.dark .cauldron{filter:brightness(.85)}
body.dark .com-page{background:linear-gradient(180deg,#131A2C 0%,#10141F 30%,#0E1016 55%)}
body.dark .detail-hero::before{filter:brightness(.75)}
/* 深色下的小色块与待选态 */
body.dark .chip{background:#171A22;border-color:#2A2F40;color:#A7AEC4}
body.dark .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
body.dark .rank-tabs .r{background:#1C2030;color:#A9B4D8}
body.dark .rank-tabs .r.on{background:#262E4E;color:#CFD8FF;box-shadow:inset 0 0 0 1px #3A4A8A}
body.dark .topic-chips .tp{background:#1A1E2C;border-color:#2A3048;color:#A9B4D8}
body.dark .topic-chips .tp b{color:#7E96FF}
body.dark .searchbar{box-shadow:none}
body.dark .searchbar input::placeholder{color:#5E6780}
body.dark .sign7 .d{background:#1D2130;color:#8A93AB}
body.dark .continue{background:linear-gradient(135deg,#1E2436,#232A44);box-shadow:inset 0 0 0 1px #2C3450}
body.dark .continue .s{color:#98A3C9}
body.dark .sheet-mask,.modal-mask{background:rgba(0,0,0,.55)}
body.dark .reader{box-shadow:none}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="screen" id="screen"></div>
</div>

<!-- 数据层：离线缓存（IndexedDB）+ 书源引擎 + 平台适配 -->
<script src="cache-idb.js"></script>
<script src="engine.js"></script>
<script src="platform.js"></script>

<script>
/* ==========================================================================
   愉阅 · 单文件阅读 App
   结构：数据层 -> 持久化 -> 视图层 -> 事件 -> 路由
   说明：演示数据为原创短篇，书源引擎为可插拔模拟实现（见 README）。
   ========================================================================== */
'use strict';

/* ------------------------- 1. 图标（内联 SVG） ------------------------- */
const I = {
  search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/>',
  back:'<path d="M12 4 4 12l8 8"/><path d="M4 12h15"/>',
  right:'<path d="M9 4l8 8-8 8"/>',

  set:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7L5.6 18.4"/>',

  plus:'<path d="M12 5v14M5 12h14"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/>',
  upload:'<path d="M12 16V4M8 8l4-4 4 4M4 16v3h16v-3"/>',
  check:'<path d="M4 12l5 5 11-11"/>',
  gift:'<path d="M4 10h16v10H4z"/><path d="M12 10v10M4 10c0-3 6-4 8 0 2-4 8-3 8 0"/>',
  fire:'<path d="M12 21c4 0 6-2.6 6-6 0-4-4-6-4-11-3 2-8 5-8 11 0 3.4 2 6 6 6z"/>',
  shield:'<path d="M12 3l7 3v6c0 5-3 8-7 9-4-1-7-4-7-9V6z"/><path d="M9 12l2 2 4-4"/>',
  search2:'<circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/>',
  edit:'<path d="M4 20h4L20 8l-4-4L4 16z"/>',
  wifi:'<path d="M4 9a11 11 0 0 1 16 0M7 12.5a7 7 0 0 1 10 0M10 16a3 3 0 0 1 4 0"/><circle cx="12" cy="19" r="1"/>'
};

  chapters:[
   {title:'第一章 夜雨孤灯', content:'雨下到第三日，青石镇的路已经泡软了。\n\n客栈檐下挂着一盏破灯，灯芯烧得只剩一指长，光晕在水汽里散开，像一团化不开的旧事。靠窗的位置坐着个背剑的年轻人，斗笠压得极低，只露出半截下颌，指节上有薄薄一层刀茧。\n\n店小二端上一碗热汤，压低声音说：“客官，前面三十里是黑风岭，最近不太平，夜里走不得。”\n\n年轻人没抬头，只把汤推回去，问了一句：“十年前，青崖山上的火，是从哪边烧起来的？”\n\n店里忽然安静了。连雨声都像被谁捏住。'},
   {title:'第二章 断桥刀', content:'黑风岭下有一座断桥，桥心断成两截，中间隔着八尺宽的水。\n\n年轻人到的时候，桥上已经站着一个人。那人穿一身洗得发白的旧袍，手里没有兵器，只提着一盏灯。灯光落在他脸上，照出半边温和的眉眼。\n\n“你找了十年。”那人先开口，“可你还记得你要找的是谁吗？”\n\n年轻人解下背后的剑，剑鞘落地，发出一声闷响。他抬起头，雨水顺着斗笠边缘淌下来：“我记得那晚的火。也记得提灯的人。”\n\n那人笑了笑，把灯往前递了递：“那就先看看，这盏灯里烧的是什么。”'},
   {title:'第三章 旧盟', content:'灯芯拨开，里面没有油，只有一小截烧焦的布。布上残留半个字，是青崖剑派的门规：剑不出鞘，先问心。\n\n年轻人盯着那半个字，手指在颤。他忽然想起十年前自己躲在柴房，透过门缝看见的那一幕——师父跪在火里，把剑插进自己胸口，抬头对着提灯的人说：“放过孩子。”\n\n“他放了我。”年轻人声音很轻，“所以这十年，我一直在找的，不是仇人。”\n\n提灯的人点点头：“你在找一个理由，让自己配得上活着。”\n\n雨忽然小了。断桥下，水声变得清晰。'},
   {title:'第四章 山河剑', content:'年轻人重新拾起剑，却没有拔。他盘膝坐在断桥的断口上，把剑横在膝头，闭了眼。\n\n提灯的人在对面坐下，像很多年前在山上教他握剑那样，慢慢说：“剑是直的，人心是弯的。你要劈开的从来不是别人。”\n\n风从岭口灌进来，吹动两人的衣角。年轻人的手一寸寸松开，剑鞘里却传出极轻的一声鸣响，像有人在很远的地方应了一声“在”。\n\n那一夜，黑风岭上的雪提前落了。第二天赶路的人说，断桥上坐着两个人，一个提灯，一个抱剑，都没有动，桥下的水却结了冰。'},
   {title:'第五章 归途', content:'天亮时，提灯的人已经不见了，只在桥面上留下一行浅浅的脚印，一直延伸到山外的方向。\n\n年轻人站起来，把剑背回身上。他没有往山里去，反而沿着那条脚印往回走。\n\n走到青石镇口，他看见昨夜的客栈已经开门，店小二正在擦桌子。年轻人把斗笠摘下来，露出一张很年轻的脸：“有热水吗？我想洗个脸。”\n\n店小二愣了一下，笑着应了。\n\n阳光落在镇口的石阶上。江湖还是那个江湖，只是从此少了一个不肯报名字的刀客，多了一个会坐下来喝汤的人。'}

  chapters:[
   {title:'第一章 十三号房', content:'老城区有家开了三十年的旅馆，叫安和。老板姓周，说话总慢半拍，登记本上永远只写到十二号房。\n\n“十三号呢？”程野问。\n\n周老板抬起眼皮：“没有十三号。老规矩，跳号。”\n\n程野把委托人的照片放在柜台上。照片上的女人叫苏绵，最后一次出现，是三个月前的凌晨，监控拍到她走进这家旅馆，再没出来。\n\n周老板盯着照片看了很久，忽然把登记本合上：“她住的是十二号。那天晚上，我听见她在跟人吵架，可房间里只有她一个。”'},
   {title:'第二章 失踪的钟', content:'安和旅馆的走廊有一面挂钟，指针停在十一点五十九分。\n\n程野伸手去拨，周老板在背后喊了一声：“别动那个。”\n\n“坏了？”\n\n“不是坏了。”周老板把一盏台灯递给他，“是每天到这个点，它就会往回退一分钟。住了十年，我没见它走到十二点。”\n\n程野在十二号房坐到深夜。墙纸泛黄，床头柜上有一圈干涸的水痕。他把手机架起来录像，自己靠在椅子上闭了眼。\n\n再睁眼时，天已经亮了。手机里的视频长达六个小时，前五个小时五十九分都是静止的房间。最后一分钟，画面里的人站了起来，走向门，把门打开。\n\n那个人穿着和程野一样的外套。'},
   {title:'第三章 雨夜访客', content:'程野把视频放慢到四分之一，一帧一帧看。\n\n开门的那一刻，走廊尽头有一盏灯亮起来，光从门缝挤进来，把房间照成一种很淡的青色。画面里的“他”回过头，正对镜头，嘴唇动了动。\n\n程野把声音放到最大，反复听了二十遍，终于辨认出三个字：“别回头。”\n\n当天夜里下起雨。有人在门外敲门，很轻，三下，停一会儿，又三下。\n\n程野没有开门。他站在门后，听见一个女人的声音贴着门板说：“程先生，我在这里住了三个月。你是不是也在找我？”'},
   {title:'第四章 镜像', content:'门开了一条缝，外面没有人，只有走廊尽头那盏灯。\n\n程野走过去，灯下压着一张旅馆的旧房卡，卡面写着十三。他回头看，走廊两边的门牌正在慢慢变化：十二、十一、十……数字一个个褪下去，像被水洗过。\n\n房卡贴上读卡器时，他听见自己的心跳声变得很远。\n\n门开了。房里坐着一个背对他的人，穿着他的外套，正在看他的手机。屏幕上是昨晚的监控画面，画面里，程野正站在门口，看着房间里的自己。'},
   {title:'第五章 真相之前', content:'“坐。”那个人说，声音和程野一模一样。\n\n程野没有坐。他问：“苏绵在哪？”\n\n“她早就出去了。”对方把手机翻过来，屏幕上是旅馆门口的监控：三个月前的凌晨四点，苏绵走出大门，神情平静，手里提着一个很旧的行李箱。\n\n“那她为什么不回家？”\n\n“因为回去的不是她。”对方抬起头，露出一张和程野完全相同的脸，“程先生，你接这桩委托的时候，有没有想过，委托人为什么知道你一定能找到？”\n\n窗外的雨停了。远处传来第一声鸟叫。'}

  chapters:[
   {title:'第一章 梧桐巷', content:'梧桐巷的夏天很长，长到可以听见蝉在树叶里换气。\n\n林晚搬到三号院那年十六岁，拖着一个比她还高的行李箱，站在门口找钥匙。隔壁的院门吱呀一声开了，一个穿白背心的少年拎着工具箱出来，问她：“要帮忙吗？”\n\n“你会开锁？”\n\n“不会。”他把工具箱往地上一放，“但我会修相机。你箱子里那个，镜头盖没盖。”\n\n林晚低头，才发现自己的旧相机从侧袋里露了出来。那天下午，她第一次走进隔壁院子，看见满桌拆开的零件，和一台被擦得发亮的海鸥相机。'},
   {title:'第二章 旧相机', content:'少年叫周迟，家里三代修相机。\n\n“这台胶片机比你年纪大。”他把相机推回来，指了指快门，“它有点慢，你得等它。”\n\n林晚试着按了一下，快门迟了半秒才响。她笑了：“跟你一样。”\n\n周迟没接话，耳朵却红了。\n\n那年秋天，梧桐叶子落满巷子。林晚每天放学都来隔壁，拍一张照片。她拍巷口卖豆腐的阿姨，拍晒在竹竿上的蓝布衫，拍猫，拍雨后的水洼。\n\n周迟问：“你怎么不拍人？”\n\n林晚把相机举起来，对着他按了快门。快门还是慢了半秒。她低头看取景器：“因为人不会等我。”'},
   {title:'第三章 雨里告白', content:'高三那年夏天，雨下得特别大。\n\n林晚抱着相机跑回家，在巷口摔了一跤，相机砸进水洼里。她蹲下去捞，手指抖得厉害。周迟从雨里冲出来，把外套罩在她头上，先捡相机，再拉她。\n\n“别哭，能修。”\n\n“修不好了。”她抹了一把脸，分不清是雨还是泪，“里面那卷，全是你。”\n\n周迟愣在雨里。梧桐叶子被雨点打得直响，整条巷子都在响。\n\n过了很久，他把相机塞回她怀里，低声说：“那下次，拍清楚一点。”'},
   {title:'第四章 迟到的信', content:'后来林晚去了北方念书，周迟留在巷子里，接手了那间修相机的小铺。\n\n他们不怎么联系。她寄过几卷胶片，他修好，再寄回来，附一张便签，写着“快门已调快”。\n\n第四年冬天，林晚收到一个包裹。里面是她十六岁那台旧相机，擦得干干净净，机身贴着一张小纸条：快门调快了，不用再等。\n\n卷片仓里还有一张没洗的底片。她拿去店里冲出来，是一张很旧的照片：雨里的梧桐巷，一个少年举着外套，挡在一个蹲在地上的姑娘头上。\n\n背面用铅笔写着一行字：这张，我等了四年。'},
   {title:'第五章 春天来了', content:'林晚回梧桐巷那天，是三月。\n\n巷口的豆腐摊还在，蓝布衫还晒在竹竿上。三号院的门虚掩着，隔壁院子传出很轻的“咔哒”一声。\n\n她推门进去。周迟正低头修一台相机，抬头看见她，手停在半空。\n\n“快门修好了？”她问。\n\n“修好了。”\n\n“那我试试。”\n\n林晚举起相机，对着他按下去。快门这一次没有迟。\n\n照片里，春天的光从窗子斜进来，落在一个笑得有点傻的人身上。'}

  chapters:[
   {title:'第一章 静止的城市', content:'第一次发生的时候，没有人察觉。\n\n下午六点十七分，整座城市的影子忽然停住。飞鸟悬在半空，雨滴挂在窗玻璃上，像一层薄薄的玻璃珠。持续十一秒，然后一切继续。\n\n新闻说是光学现象。观测站的记录里，只有陈默一个人写了四个字：不是光学。\n\n他是站里最不受欢迎的人，因为他总在别人下班以后，把白天的数据重新算一遍。那天夜里，他在时间序列里看见一条极细的重复纹路，像唱片上的一道划痕。'},
   {title:'第二章 循环', content:'第二次，他有了准备。\n\n六点十七分，他盯着秒表。城市静止的十一秒里，秒表还在走。他把手伸到窗外，一片悬停的叶子贴在他掌心，带着真实的重量。\n\n“只有人能动。”他在记录本上写。\n\n第七次之后，他已经能在静止的十一秒里走出三条街。空荡的马路上，所有人都保持着上一刻的姿势：有人举着手机，有人正在笑，有人在红绿灯下抬头。\n\n他走到广场中央，看见一个坐着的小女孩。她也在动。她抬头看他，说：“叔叔，你也在数吗？”'},
   {title:'第三章 观测者', content:'女孩叫小满，八岁，记得每一次静止。\n\n“第八次了。”她掰着手指，“每次都是十一秒。第一次我以为是做梦。”\n\n陈默蹲下来问她：“静止的时候，你能听见什么吗？”\n\n小满想了想：“有人在天上翻书。”\n\n那天回去，陈默把观测站十年的数据全部调出来。凌晨三点，他在一段被标记为“设备故障”的旧记录里发现异常：二十年前的同一天，同一分钟，城市曾经静止过一次。\n\n记录人签名的那一栏，写着他的名字——陈默。'},
   {title:'第四章 第九次', content:'第九次日落来得比往常早。\n\n六点十七分，光停在楼群的玻璃上，整座城市像一张被按了暂停的照片。陈默站在观测站顶楼，手里拿着那份二十年前的记录。\n\n他忽然明白了：静止不是故障，是一次校准。有人每隔一段时间，把这座城市的时间拨回原点，好让某件事重新发生一次。\n\n而他之所以记得，是因为每一次，他都是那个按下去的人。\n\n楼下的广场上，小满仰着头，朝他挥手。他隔着十一秒的城市，听见她很轻地喊：“叔叔，这次别再按了。”'},
   {title:'第五章 日出', content:'第十一天的清晨，城市没有停。\n\n六点十七分过去的时候，陈默正在喝一杯凉掉的咖啡。窗外的鸟飞过去了，雨落在玻璃上，滑下来。\n\n他把二十年前的记录本合上，锁进柜子最底层。\n\n下楼时，广场上有个小女孩在等公交，背着一个过大的书包。她抬头看见他，愣了一下，然后很礼貌地笑：“叔叔早。”\n\n她并不认识他。\n\n陈默站在晨光里，忽然觉得这座城市有点陌生，又有点新鲜。太阳从楼群的缝隙里升起来，把整条街照成了金色。'}

  intro:'一间开在巷子深处的小馆子，一天只做十二碗面。老板不记名字，只记口味。有人吃着吃着就哭了，有人吃着吃着就留下了。',
  chapters:[

/* ------------------------- 3. 持久化存储 ------------------------- */
/* 优先 localStorage；不可用（如部分浏览器 file:// 限制）时降级为内存，功能不中断。 */
const KEY = 'shiye.reader.v1';
const Store = (() => {
  let mem = null, ok = true;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ ok = false; }
  return {
    get(){ if(!ok) return mem; try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } },
    set(v){ if(!ok){ mem = v; return; } try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){ mem = v; ok = false; } },
    clear(){ if(ok) try{ localStorage.removeItem(KEY); }catch(e){}; mem = null; }
  };
})();

function defaultState(){
  return {
    user:{ name:'本地访客', avatar:'访' },
    view:'home', tab:'home',
    shelf:[],                      // [{id, group, addedAt}]
    progress:{},                   // {bookId:{ch, ratio, ts}}
    readSeconds:0,
    settings:{ fontSize:19, lineHeight:1.95, theme:'white', bright:100, pure:true, dark:false, rate:1 },
    searchHistory:[],
    sourceOn:{},                   // {sourceId:bool} 书源开关（服务端也有，这里做即时反馈）
    rmMeta:{},                     // 远程书的轻量元信息（刷新后据此重新拉目录）
    posts: JSON.parse(JSON.stringify(SEED_POSTS))
  };
}
let S = (() => {
  const saved = Store.get();
  const base = defaultState();
  if(!saved) return base;
  // 浅合并，兼容旧数据缺字段
  return Object.assign(base, saved, {
    settings:Object.assign(base.settings, saved.settings||{}),
    user:Object.assign(base.user, saved.user||{}),
  });
})();
function save(){ Store.set(S); }

/* ==========================================================================
   4.1 本地书源服务（/api）
   --------------------------------------------------------------------------
   浏览器受同源策略限制，没法直接抓第三方站点；愉阅-书源版由 server.py 代理：
   导入的阅读(Legado)书源 JSON → 本地规则引擎解析 → 搜索/目录/正文经 /api 返回。
   直接用 file:// 打开时自动指向 127.0.0.1:5188；服务没起则退回离线演示书库。
   ========================================================================== */
const API_BASE = (location.protocol === 'file:') ? 'http://127.0.0.1:5188' : location.origin;

const LIVE = {
  online:false, checking:true,
  sources:{ total:0, enabled:0, ok:0 },
  books:[],                                  // 远程书（含目录、按需正文），内存态
  search:{ key:'', state:'idle', res:null, err:'' },
  srcList:null, srcLoading:false, srcFilter:'ok',
  cache:{}                                   // 每本书的离线缓存状态（按 book.id）
};

/* ==========================================================================
   离线缓存（整本下载）
   - 服务端把目录里所有章节抓下来存成 data/books/<id>.json
   - 前端只负责发起任务、轮询进度、显示"已缓存"
   ========================================================================== */
function fmtSize(n){
  if(!n) return '';
  return n >= 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.round(n/1024)+' KB';
}
function cacheEntry(b){ return (LIVE.cache || {})[b && b.id]; }
function cacheText(b){
  const c = cacheEntry(b);
  if(!c) return '正在检查本地缓存…';
  if(c.state === 'running'){
    if(!c.total) return '正在读取目录…';
    return `下载中 ${c.done||0}/${c.total} 章${c.failed?` · 失败 ${c.failed}`:''}`;
  }
  if(c.state === 'error') return '下载中断：' + (c.err || '未知错误');
  if(c.cached) return `已缓存 ${c.done||c.total} 章 · ${fmtSize(c.size)} · 断网也能读`;
  return '把整本书的正文存到本地，之后断网也能读';
}
function cacheBtnText(b){
  const c = cacheEntry(b);
  if(!c) return '下载全本';
  if(c.state === 'running') return '下载中…';
  return c.cached ? '删除缓存' : '下载全本';
}
function dlPaint(b){
  const sub = $('#dl-sub'), btn = $('#dl-btn'), bar = $('#dl-bar'), wrap = $('#dl-barwrap');
  if(!sub || !b) return;
  const c = cacheEntry(b) || {};
  sub.textContent = cacheText(b);
  if(btn){
    btn.textContent = cacheBtnText(b);
    btn.disabled = c.state === 'running';
    btn.dataset.act = c.cached ? 'dl-remove' : 'dl-book';
  }
  if(wrap && bar){
    if(c.state === 'running'){
      wrap.style.display = 'block';
      if(c.total){ bar.style.width = Math.max(2, Math.round((c.done / c.total) * 100)) + '%'; wrap.classList.remove('indet'); }
      else { bar.style.width = '100%'; wrap.classList.add('indet'); }
    }
    else if(c.cached){ wrap.style.display = 'block'; bar.style.width = '100%'; wrap.classList.remove('indet'); }
    else { wrap.style.display = 'none'; wrap.classList.remove('indet'); }
  }
}
function loadCacheInfo(b, then){
  if(!b || !b.remote) return;
  api(`/api/cache/info?src=${b.sourceId}&url=${encodeURIComponent(b.bookUrl)}`).then(d => {
    LIVE.cache = LIVE.cache || {};
    LIVE.cache[b.id] = Object.assign({}, d, { job: d.job });
    dlPaint(b);
    then && then(d);
  }).catch(()=>{});
}
function dlPoll(b){
  const c = cacheEntry(b);
  if(!c || !c.job) return;
  api(`/api/cache/status?job=${c.job}`).then(d => {
    LIVE.cache[b.id] = Object.assign({}, LIVE.cache[b.id], d, { job: c.job });
    dlPaint(b);
    if(d.state === 'running') setTimeout(()=>dlPoll(b), 1500);
    else if(d.state === 'done'){
      LIVE.cache[b.id].cached = true;
      loadCacheInfo(b);
      toast('整本已缓存到本地，可离线阅读');
    } else {
      toast('下载失败：' + (d.err || '未知错误'));
      loadCacheInfo(b);
    }
  }).catch(()=>{ setTimeout(()=>dlPoll(b), 2000); });
}

function api(path, opts = {}){
  // 数据层交给 platform.js 决定：Vercel 走 HTTP 接口，Cloudflare 走浏览器内的规则引擎
  if(window.PLAT && typeof PLAT.call === 'function') return PLAT.call(path, opts);
  const o = Object.assign({}, opts);
  if(o.body && typeof o.body !== 'string') o.body = JSON.stringify(o.body);
  return fetch(API_BASE + path, o).then(r =>
    r.json().then(j => { if(!r.ok) throw new Error(j.error || ('HTTP '+r.status)); return j; },
                    () => { throw new Error('HTTP '+r.status); })
  );
}

async function checkHealth(){
  try{
    const h = await api('/api/health');
    LIVE.online = true;
    LIVE.sources = h.sources || LIVE.sources;
  }catch(e){ LIVE.online = false; }
  LIVE.checking = false;
  return LIVE.online;
}

function coverSrc(b){
  if(!b) return null;
  if(b.remote && b.remoteCover) return `${API_BASE}/api/img?u=${encodeURIComponent(b.remoteCover)}&src=${b.sourceId}`;
  return null;
}

/* 远程书：内存里没有就从 localStorage 的元信息重建，并自动拉目录 */
function remoteBook(id){
  let b = (LIVE.books||[]).find(x => x.id === id);
  if(b) return b;
  const m = (S.rmMeta || {})[id];
  if(!m) return null;
  b = { id, remote:true, sourceId:m.sourceId, sourceName:m.sourceName, bookUrl:m.bookUrl,
        title:m.title, author:m.author||'', intro:m.intro||'', remoteCover:m.remoteCover||'',
        cover:['#2B3A67','#7C8FF0'], cat:'站外聚合', tags:[m.sourceName||'书源'],
        hot:0, variants:m.variants||[{sid:m.sourceId,url:m.bookUrl,source:m.sourceName}],
        chapters:[], loading:true, fetchStarted:false, error:'' };
  LIVE.books.push(b);
  return b;
}

/* 拉取远程书的目录（详情页/阅读器打开时调用一次） */
function fetchRemoteToc(b, onDone){
  if(!b || !b.remote) { onDone && onDone(); return; }
  if(b.fetchStarted || (b.chapters && b.chapters.length)) { onDone && onDone(); return; }
  b.fetchStarted = true; b.loading = true; b.error = '';
  const v = (b.variants||[])[b.variantIdx||0] || {sid:b.sourceId, url:b.bookUrl};
  api(`/api/book?src=${v.sid}&url=${encodeURIComponent(v.url)}`).then(d => {
    b.chapters = (d.chapters||[]).map(c => ({ title:c.name, url:c.url, content:'' }));
    if(d.name && (!b.title || b.title.length < 2)) b.title = d.name;
    b.author = d.author || b.author;
    b.intro = d.intro || b.intro;
    b.remoteCover = d.cover || b.remoteCover;
    b.kind = d.kind || '';
    b.loading = false;
    if(!b.chapters.length) b.error = '这个书源没解析出目录，可以在详情页里「换源」重试';
    (S.rmMeta||{})[b.id] = Object.assign({}, S.rmMeta[b.id], { title:b.title, author:b.author,
      intro:b.intro, remoteCover:b.remoteCover });
    save();
    onDone && onDone();
  }).catch(e => {
    b.loading = false; b.fetchStarted = false;
    b.error = '目录加载失败：' + e.message;
    onDone && onDone();
  });
}

/* 打开一条在线搜索结果：先占位渲染详情，再异步补目录 */
function openRemote(item, idx = 0){
  const v = (item.variants||[])[idx];
  if(!v){ toast('这条结果没有可用书源'); return; }
  const id = 'r-' + v.sid + '-' + Math.abs(hashCode(v.url));
  if(!(LIVE.books||[]).some(b => b.id === id)){
    LIVE.books.push({
      id, remote:true, sourceId:v.sid, sourceName:v.source, bookUrl:v.url,
      title:item.name, author:item.author || '', intro:item.intro || '',
      remoteCover:item.cover || '', cover:['#2B3A67','#7C8FF0'], cat:'站外聚合',
      tags:[v.source || '书源'], hot:0, variants:item.variants||[v],
      chapters:[], loading:true, fetchStarted:false, error:'', variantIdx:idx
    });
  }
  if(!S.rmMeta) S.rmMeta = {};
  S.rmMeta[id] = { sourceId:v.sid, sourceName:v.source, bookUrl:v.url, title:item.name,
                   author:item.author||'', intro:item.intro||'', remoteCover:item.cover||'',
                   variants:item.variants||[v] };
  S.bookId = id; S.view = 'book'; S.introOpen = false; save(); render();
  const bk = remoteBook(id);
  fetchRemoteToc(bk, () => { if(S.bookId === id) render(); });
}

/* 阅读器章节正文按需拉取 */
function loadChapter(b, idx, onDone){
  const c = b && b.chapters && b.chapters[idx];
  if(!b || !b.remote || !c) { onDone && onDone(); return; }
  if(c.content || c.fetching) { onDone && onDone(); return; }
  c.fetching = true;
  api(`/api/content?src=${b.sourceId}&url=${encodeURIComponent(c.url)}&book=${encodeURIComponent(b.bookUrl||'')}`)
    .then(d => { c.content = d.text || ''; c.fetching = false; if(!c.content) c.error='正文是空的，换源试试'; rdFillSection(b, idx); onDone && onDone(); })
    .catch(e => { c.fetching = false; c.error = '正文加载失败：' + e.message; rdFillSection(b, idx); onDone && onDone(); });
}

/* ==========================================================================
   连续阅读（无限滚动）
   - rdRT.loaded 记录当前屏幕里已经接在一起的章节序号，[0] 是"进入时那一章"
   - 滑到章末自动把下一章接上来（服务端按章抓正文，本地书直接用现成内容）
   - 点目录/上一章/下一章属于"跳转"，routes.reader 里发现当前章不在 loaded 里就重置
   ========================================================================== */
let rdRT = {bookId:null, loaded:[], loading:false};

/* 某一章正文变化后，只重绘这一节（不动滚动位置） */
function rdFillSection(b, idx){
  if(!b || S.view !== 'reader' || S.bookId !== b.id) return;
  const body = $('#rd-body'); if(!body) return;
  const c = b.chapters[idx]; if(!c) return;
  const sec = body.querySelector(`section.rd-ch[data-ch="${idx}"]`);
  if(!sec) return;
  sec.innerHTML = `<div class="ch-title">${esc(c.title)}</div>` +
    (c.content ? rdParasHTML(c)
               : `<div class="rd-loading">${c.error ? esc(c.error) : '正在从书源抓取正文…'}${
                    c.error ? ` · <button data-act="retry-ch" data-ch="${idx}" style="border:0;background:none;color:#2B6BE6;font-size:12.5px;text-decoration:underline">重试</button>` : ''}</div>`);
}

function rdParagraphs(c){
  return (c && c.content ? c.content : '').split('\n\n').filter(Boolean);
}
function rdParasHTML(c){
  return rdParagraphs(c).map((p,k)=>`<p data-p="${k}">${esc(p)}</p>`).join('');
}
function rdChapterHTML(b, i, r){
  const c = b.chapters[i]; if(!c) return '';
  const isFirst = rdRT.loaded[0] === i;
  return `<section class="rd-ch" data-ch="${i}">
    <div class="ch-title">${esc(c.title)}</div>
    ${!r.pure && isFirst ? `<div class="site-note"><span class="lb">原网页</span>这是未清洗前的站点页面：顶部导航、侧栏推荐和悬浮按钮都在，正文被挤在中间。开启「纯净阅读」后只保留正文。</div>` : ''}
    ${c.content ? rdParasHTML(c) : `<div class="rd-loading">${c.error ? esc(c.error) : '正在从书源抓取正文…'}</div>`}
  </section>`;
}
function rdTailText(){
  const b = book(S.bookId); if(!b) return '';
  const last = rdRT.loaded.length ? rdRT.loaded[rdRT.loaded.length-1] : 0;
  if(rdRT.loading) return '正在加载下一章…';
  return last+1 < b.chapters.length ? '继续下滑，自动接下一章' : '已是最后一章';
}
function rdTailNote(msg){
  const el = $('#rd-tail-note'); if(el) el.textContent = msg || rdTailText();
}
/* 把下一章接到底部：先插占位，正文到达后原地填充，滚动位置不动 */
function rdAppendNext(){
  const b = book(S.bookId);
  if(!b || !b.chapters || rdRT.loading) return;
  const last = rdRT.loaded.length ? rdRT.loaded[rdRT.loaded.length-1] : (S.reader||{}).ch || 0;
  const idx = last + 1;
  if(idx >= b.chapters.length){ rdTailNote('已是最后一章'); return; }
  const c = b.chapters[idx], body = $('#rd-body'), tail = $('#rd-tail');
  if(!body || !tail) return;
  rdRT.loading = true;
  rdTailNote();
  const sec = document.createElement('section');
  sec.className = 'rd-ch'; sec.dataset.ch = idx;
  sec.innerHTML = `<div class="ch-title">${esc(c.title)}</div><div class="rd-loading">正在从书源抓取正文…</div>`;
  tail.parentNode.insertBefore(sec, tail);
  rdRT.loaded.push(idx);
  const fill = () => {
    rdRT.loading = false;
    rdFillSection(b, idx);
    rdTailNote();
    if(S.view === 'reader' && S.bookId === b.id) syncReaderFoot();
  };
  if(!c.content) loadChapter(b, idx, fill);
  else fill();
}
/* 更新底栏：当前章 / 百分比 */
function syncReaderFoot(){
  const b = book(S.bookId), body = $('#rd-body'), r = S.reader;
  if(!b || !body || !r || !b.chapters.length) return;
  const bodyTop = body.getBoundingClientRect().top;
  let cur = r.ch, within = 0;
  body.querySelectorAll('section.rd-ch').forEach(s => {
    const top = s.getBoundingClientRect().top - bodyTop + body.scrollTop;
    const bottom = top + s.offsetHeight;
    if(top - body.scrollTop <= body.clientHeight * 0.28) {
      cur = Number(s.dataset.ch);
      within = Math.min(1, Math.max(0, (body.scrollTop - top) / Math.max(1, s.offsetHeight)));
    }
  });
  const foot = $('#rd-foot span'); if(foot) foot.textContent = `${cur+1}/${b.chapters.length}`;
  const bar = $('#rd-prog');
  const max = body.scrollHeight - body.clientHeight;
  if(bar) bar.style.width = (max > 0 ? (body.scrollTop / max * 100) : 0).toFixed(1) + '%';
  const pc = $('#rd-pct');
  if(pc) pc.textContent = Math.max(1, Math.min(100, Math.round(((cur + within) / b.chapters.length) * 100))) + '%';
}

/* 在线搜索：本地命中立即渲染，真实结果回填（避免白屏） */
function liveSearch(key){
  LIVE.search = { key, state:'loading', res:null, err:'' };
  render();
  const done = d => {
    LIVE.search = { key, state:'done', res:d, err:'' };
    LIVE.sources = Object.assign({}, LIVE.sources);
    if(S.view === 'search' && (S.query||'') === key) render();
  };
  const fail = e => {
    LIVE.search = { key, state:'error', res:null, err:e.message };
    if(S.view === 'search' && (S.query||'') === key) render();
  };
  // 云端版直接在浏览器里跑引擎：边搜边把已完成的结果推上来，不用等全部源跑完
  if(window.ShuyeEngine && window.PLAT && PLAT.mode === 'cloudflare'){
    ShuyeEngine.search(key, 400, 1, part => {
      if((S.query||'') !== key || part.partial === false) return;
      LIVE.search = { key, state:'loading', res:part, err:'' };
      if(S.view === 'search') render();
    }).then(done).catch(fail);
    return;
  }
  api(`/api/search?key=${encodeURIComponent(key)}&limit=400`).then(done).catch(fail);
}

function loadSourceList(force){
  if(LIVE.srcLoading) return;
  LIVE.srcLoading = true;
  api('/api/sources').then(d => {
    LIVE.srcList = d.list || []; LIVE.srcLoading = false;
    // 列表里的 total/enabled 才是删改后的真实状态，同步给顶部标题和统计卡
    LIVE.sources = Object.assign({}, LIVE.sources, {
      total: d.total || (d.list||[]).length,
      enabled: (d.list||[]).filter(x=>x.enabled).length,
      ok: (d.list||[]).filter(x=>x.status==='ok').length
    });
    if(S.view === 'sources') render();
  }).catch(e => { LIVE.srcLoading = false; LIVE.srcList = []; toast('书源列表加载失败：'+e.message); if(S.view==='sources') render(); });
}

/* 全书进度：按章节权重估算（每章等权，章内按滚动比例） */
function bookProgress(id){
  const p = S.progress[id]; const b = book(id);
  if(!p || !b) return null;
  return ((p.ch + (p.ratio||0)) / b.chapters.length);
}
function progressText(id){

  if(!p || !b) return '未开始';

/* 阅读器：滚动进度保存 + 恢复 */
let scrollTimer = null;
hook('reader', () => {
  const body = $('#rd-body');
  if(!body) return;
  const b = book(S.bookId);
  const p = S.progress[S.bookId];
  if(p && p.ratio) requestAnimationFrame(()=>{ body.scrollTop = p.ratio * (body.scrollHeight - body.clientHeight); });
  const update = () => {
    const max = body.scrollHeight - body.clientHeight;
    const ratio = max > 0 ? body.scrollTop / max : 0;
    // 当前读到哪一章：以视口上方 28% 处所在的章节为准（连续阅读时屏幕里可能有两章）
    const bodyTop = body.getBoundingClientRect().top;
    let cur = (S.reader||{}).ch || 0, within = 0;
    body.querySelectorAll('section.rd-ch').forEach(s => {
      const top = s.getBoundingClientRect().top - bodyTop + body.scrollTop;
      if(top - body.scrollTop <= body.clientHeight * 0.28){
        cur = Number(s.dataset.ch);
        within = Math.min(1, Math.max(0, (body.scrollTop - top) / Math.max(1, s.offsetHeight)));
      }
    });
    if(S.reader && S.reader.ch !== cur) S.reader.ch = cur;   // 读到下一章就更新"当前章"，进度/目录都跟着走
    S.progress[S.bookId] = {ch: cur, ratio, ts:Date.now()};
    const bar = $('#rd-prog'); if(bar) bar.style.width = (ratio*100).toFixed(1)+'%';
    const pc = $('#rd-pct');
    if(pc && b && b.chapters && b.chapters.length){
      pc.textContent = Math.max(1, Math.min(100, Math.round(((cur + within) / b.chapters.length) * 100))) + '%';
    }
    const foot = $('#rd-foot span'); if(foot) foot.textContent = `${cur+1}/${b.chapters.length}`;
    // 快滑到本章末尾：直接把下一章接上来
    if(max - body.scrollTop < 420) rdAppendNext();
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(save, 400);
  };
  body.addEventListener('scroll', update, {passive:true});
  update();

  // 跳章（目录 / 上一章 / 下一章）：把目标章滚到顶部
  if(window.__rdJump != null){
    const target = window.__rdJump; window.__rdJump = null;
    requestAnimationFrame(()=>{
      const s = body.querySelector(`section.rd-ch[data-ch="${target}"]`);
      if(s) body.scrollTop = Math.max(0, s.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop - 8);
    });
  }

  // 左右滑动翻章
  let x0=0,y0=0,t0=0;
  body.addEventListener('touchstart', e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); }, {passive:true});
  body.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6 && Date.now()-t0<600){
      dx<0 ? window.__nextChapter() : window.__prevChapter();
    }
  }, {passive:true});

  // 点击中部：沉浸模式
  body.addEventListener('click', e=>{
    if(e.target.closest('p') && window.getSelection().toString()) return;
    const rd = $('.reader');
    rd.classList.toggle('immersive');
    const head=$('#rd-head'), foot=$('#rd-foot'), tools=$('.reader-tools');
    const off = rd.classList.contains('immersive');
    [head,foot,tools].forEach(el=>{ if(el) el.style.opacity = off?'0':'1'; el && (el.style.pointerEvents = off?'none':''); });
  });
});

/* 听书（Web Speech API） */
const tts = {playing:false, idx:0, utterances:[], timer:null};
function ttsStop(){
  tts.playing = false;
  if(window.speechSynthesis) speechSynthesis.cancel();
  clearTimeout(tts.timer);
}
function ttsSpeakFrom(i){
  // 连续阅读模式下，屏幕里可能已经接了好几章，直接读 DOM 里的全部段落
  const nodes = $$('#rd-body p');
  const all = nodes.map(p=>p.textContent.replace(/\s+/g,'')).filter(Boolean);
  if(!all.length){
    toast('这一章还没抓到正文');
    return;
  }
  if(!('speechSynthesis' in window)){
    toast('当前浏览器不支持语音朗读，可换用 Chrome / Edge 或手机浏览器');
    return;
  }
  speechSynthesis.cancel();
  tts.idx = Math.max(0, i);
  tts.playing = true;
  const speakOne = (k) => {
    if(k >= all.length){ ttsStop(); toast('已读到当前加载的最后一章'); return; }
    const u = new SpeechSynthesisUtterance(all[k]);
    u.lang = 'zh-CN'; u.rate = S.settings.rate || 1;
    u.onstart = () => {
      tts.idx = k;
      nodes.forEach((p,j)=>p.classList.toggle('hl', j===k));
      nodes[k].scrollIntoView({block:'center', behavior:'smooth'});
      const tip = $('.tts-bar div[style*="font-size:12.5px"]');
      if(tip) tip.textContent = `听书 · ${S.settings.rate}x`;
    };
    u.onend = () => { if(tts.playing) speakOne(k+1); };
    u.onerror = () => { if(tts.playing) speakOne(k+1); };
    speechSynthesis.speak(u);
  };
  speakOne(tts.idx);
  toast('开始朗读');
}

/* 打开阅读器 */
function openReader(bookId, ch){
  const b = book(bookId);
  if(!b) return;
  S.bookId = bookId;
  S.reader = {bookId, ch: ch ?? ((S.progress[bookId]||{}).ch || 0), pure:S.settings.pure, tts:false};
  S.view = 'reader';
  save(); render();
}
window.__nextChapter = () => {
  const b = book(S.bookId); const r = S.reader||{};
  if(r.ch < b.chapters.length-1){
    ttsStop(); r.ch++; window.__rdJump = r.ch; save(); render();
  } else toast('已经是最后一章了');
};
window.__prevChapter = () => {
  const r = S.reader||{};
  if(r.ch>0){ ttsStop(); r.ch--; window.__rdJump = r.ch; save(); render(); }
  else toast('已经是第一章了');
};

const RIGHTS_BOOKS = {
  '射雕英雄传':'金庸','神雕侠侣':'金庸','倚天屠龙记':'金庸','天龙八部':'金庸','笑傲江湖':'金庸',
  '鬼吹灯':'天下霸唱','盗墓笔记':'南派三叔','斗破苍穹':'天蚕土豆','庆余年':'猫腻','三体':'刘慈欣',
  '赘婿':'愤怒的香蕉','凡人修仙传':'忘语'
};

function buildResults(q){
  const key = q.trim();
  if(!key) return {list:[], bookCount:0, fuzzy:false, similar:[], rights:null};
  const kw = key.toLowerCase();
  const all = allBooks();
  const hits = all.filter(b =>
    (b.title+b.author+b.cat+b.tags.join('')+b.intro).toLowerCase().includes(kw));
  const fuzzy = hits.length === 0;

  // 未命中时：按分类/标签/关键词重合度挑 3 本本地书做「猜你想读」，不再假装有站外结果
  let similar = [];
  if(fuzzy){
    const tokens = [...new Set(key.split(/[\s·、,，。]+/).filter(Boolean))];
    similar = all.map(b=>{
      let score = 0;
      tokens.forEach(t=>{
        const hay = (b.cat + b.tags.join('') + b.intro + b.title + b.author).toLowerCase();
        if(hay.includes(t.toLowerCase())) score += 4;
      });
      return {b, score};
    }).sort((x,y)=> (y.score - x.score) || (y.b.hot - x.b.hot))
      .slice(0,3).map(x=>x.b);
  }

  const rightsKey = Object.keys(RIGHTS_BOOKS).find(t => key.includes(t)) || null;

  const out = [];
  hits.forEach(b => {
    out.push({ bookId:b.id, source:SOURCES[0], title:b.title, author:b.author, intro:b.intro, pure:true, builtin:true });
    [SOURCES[1], SOURCES[3]].forEach((s, i) => {
      out.push({
        bookId:b.id, source:s, builtin:false,
        title: `${b.title}${i===0?'_全本在线阅读':'_最新章节'}_${s.name}`,
        author:b.author, intro:b.intro, pure:s.pure
      });
    });
  });
  return {list:out, bookCount:hits.length, fuzzy, similar, rights: rightsKey ? {title:rightsKey, author:RIGHTS_BOOKS[rightsKey]} : null};
}

routes.shelf = () => {
  const sort = S.shelfSort || 'recent';
  const items = S.shelf.map(x => ({...x, b:book(x.id)})).filter(x=>x.b);
  items.sort((a,b)=>{
    if(sort==='name') return a.b.title.localeCompare(b.b.title,'zh');
    if(sort==='added') return b.addedAt - a.addedAt;
    const pa = (S.progress[a.id]||{}).ts||0, pb = (S.progress[b.id]||{}).ts||0;
    return pb - pa;
  });
  const last = items.find(x=>S.progress[x.id]);
  return `
  <div class="scroll">
    <div class="shelf-head">
      <h2>书架</h2>
      <div class="shelf-tools">
        <button class="icon-btn" data-act="shelf-manage" title="${S.shelfManage?'完成':'管理'}">${S.shelfManage?ic('check','ico'):ic('more','ico')}</button>
        <button class="icon-btn" data-act="go-search" title="搜索">${ic('search','ico')}</button>
      </div>

    ${items.length===0 ? `

        <div style="font-size:11.5px">去搜索一本想看的书，或者导入本地 TXT</div>

          <button class="btn line" style="height:38px" data-act="import-txt">导入 TXT</button>
        </div>
      </div>` : `
      ${last ? `<div class="continue" data-act="open-book" data-id="${last.id}">
        <div class="cover sm" style="--c1:${last.b.cover[0]};--c2:${last.b.cover[1]}"><b>${esc(last.b.title.slice(0,4))}</b></div>

        <button class="s ${sort==='recent'?'on':''}" data-act="shelf-sort" data-s="recent">最近阅读</button>

      <div class="shelf-grid">

        <div class="it" data-act="${S.shelfManage?'shelf-del':'open-book'}" data-id="${x.id}">
          <div class="cover" style="--c1:${x.b.cover[0]};--c2:${x.b.cover[1]}">
            <b>${esc(x.b.title.slice(0,6))}</b>
            ${S.progress[x.id] && Date.now()-(S.progress[x.id].ts||0)<86400000?'<span class="newdot"></span>':''}
            ${S.shelfManage?'<div style="position:absolute;inset:0;background:rgba(220,40,40,.55);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;z-index:2">移出 +</div>':''}

/* ==========================================================================
   交互：通用弹层 / 提示 / 面板
   ========================================================================== */
let modalEl = null;
function closeModal(){
  if(modalEl){ modalEl.remove(); modalEl = null; }
}
function modal(html, opts={}){
  closeModal();
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="modal-mask show" data-act="close-modal"></div>
    <div class="modal show">${html}</div>`;
  $('#screen').appendChild(wrap);
  modalEl = wrap;
  if(opts.onMount) opts.onMount(wrap);
  return wrap;
}
let toastTimer = null;
function toast(msg){
  let el = document.querySelector('.toast');
  if(!el){ el = document.createElement('div'); el.className = 'toast'; $('#screen').appendChild(el); }
  el.textContent = msg;
  requestAnimationFrame(()=>el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2000);
}
function openSheet(name){
  const s = $('#sheet-'+name), m = $('#mask-'+name);
  if(s) s.classList.add('show'); if(m) m.classList.add('show');
}
function closeSheet(name){
  const s = $('#sheet-'+name), m = $('#mask-'+name);
  if(s) s.classList.remove('show'); if(m) m.classList.remove('show');
}

function openBook(id){
  S.bookId = id; S.view = 'book'; S.introOpen = false; save(); render();
  const sc = $('#screen .scroll'); if(sc) sc.scrollTop = 0;
}
function doSearch(q){
  const kw = (q ?? $('#q')?.value ?? '').trim();
  if(!kw){ toast('先输入书名、作者或关键词'); return; }
  S.query = kw;

/* 导入本地 TXT：按「第 x 章 / 回 / 节」切分 */
function pickTxt(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.txt,text/plain';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', () => {
    const f = input.files && input.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const text = String(reader.result||'').replace(/\r\n?/g,'\n');
        if(text.length < 200){ toast('文件内容太短，无法识别章节'); return; }
        let chapters = [];
        const re = /第[零〇一二三四五六七八九十百千万0-9]{1,8}[章回节]/g;
        const marks = [...text.matchAll(re)].map(m=>m.index).filter((v,i,a)=>v>0 && v!==a[i-1]);
        if(marks.length >= 2){
          marks.forEach((start,i)=>{
            const end = i+1<marks.length ? marks[i+1] : text.length;
            const block = text.slice(start, end);
            const title = block.split('\n')[0].trim().slice(0,30);
            const body = block.slice(title.length).trim();
            if(body.length > 80) chapters.push({title, content: body});
          });
        }
        if(!chapters.length){
          // 没有章节标记：按 4000 字切分
          const size = 4000;
          for(let i=0;i<text.length;i+=size){
            chapters.push({title:`第 ${i/size+1} 部分`, content:text.slice(i,i+size)});
          }
        }
        const id = 'local_' + Date.now();
        const title = f.name.replace(/\.txt$/i,'').slice(0,24) || '本地书籍';
        S.localBooks = S.localBooks || [];
        S.localBooks.push({
          id, title, author:'本地导入', cat:'本地', tags:['TXT','本地'],
          cover:['#3E4A6E','#7C8FC4'], hot:0,
          intro:`从本地导入的 TXT 文件，共 ${chapters.length} 章，约 ${Math.round(text.length/1000)}k 字。`,
          chapters
        });
        if(!inShelf(id)) S.shelf.unshift({id, group:'默认分组', addedAt:Date.now()});
        save(); render();
        toast(`导入成功：${title} · ${chapters.length} 章`);
      }catch(e){ toast('解析失败，请确认是 UTF-8 编码的 TXT'); }
    };
    reader.readAsText(f, 'utf-8');
  });
  input.click();
}

  'tts-rate'(){
    const rates = [0.8, 1, 1.25, 1.5];
    const i = rates.indexOf(S.settings.rate);
    S.settings.rate = rates[(i+1) % rates.length];
    save(); render(); toast('语速 '+S.settings.rate+'x');
  },
  'tts-rate-fast'(){ ACTIONS['tts-rate'](); },
  'shelf-sort'(el){ S.shelfSort = el.dataset.s; save(); render(); },
  'shelf-manage'(){ S.shelfManage = !S.shelfManage; save(); render(); },
  'shelf-del'(el){
    S.shelf = S.shelf.filter(x=>x.id!==el.dataset.id);
    if(!S.shelf.length) S.shelfManage = false;
    save(); render(); toast('已移出书架');
  },
  'com-tab'(el){ S.comTab = el.dataset.tab; save(); render(); },
  'open-post'(el){ S.postId = el.dataset.id; S.view='post'; save(); render(); },
  'like-post'(el){
    const p = S.posts.find(x=>x.id===el.dataset.id); if(!p) return;
    p.liked = !p.liked; p.likes += p.liked?1:-1; save(); render();
  },
  'share-post'(){ navigator.clipboard?.writeText('愉阅社区 · 一起读点好的').catch(()=>{}); toast('已复制分享文案'); },
  'add-post'(){
    window.__postTopic = '# 读书随想';
    const topics = ['# 读书随想','# 必须推荐的一本小说','# 精准吐槽','# 书单共创'];
    modal(`<h4 style="text-align:left">发布帖子</h4>
      <textarea id="np-text" class="field" rows="5" placeholder="说点什么吧…" style="margin-top:6px"></textarea>
      <div class="form-row">
        ${topics.map((t,i)=>`<button class="chip ${i===0?'on':''}" data-act="pick-topic" data-t="${t}">${t}</button>`).join('')}
      </div>
      <div class="acts">
        <button class="btn line" data-act="close-modal">取消</button>
        <button class="btn primary" data-act="send-post">发布</button>
      </div>`, {onMount(w){ setTimeout(()=>w.querySelector('#np-text')?.focus(), 80); }});
  },
  'pick-topic'(el){
    window.__postTopic = el.dataset.t;
    $$('.chip[data-act="pick-topic"]').forEach(c=>c.classList.toggle('on', c===el));
  },
  'send-post'(){
    const ta = $('#np-text'); const text = (ta?.value||'').trim();
    if(text.length < 4){ toast('再多写几个字吧'); return; }
    const p = {id:'p'+Date.now(), user:S.user.name, ava:S.user.avatar||'访', time:'刚刚',
      topic:window.__postTopic||'', text, likes:0, liked:false, comments:[]};
    S.posts.unshift(p); save(); closeModal();
    S.view='community'; S.tab='community'; render();
    toast('发布成功');
  },
  'send-comment'(el){
    const p = S.posts.find(x=>x.id===el.dataset.id);
    const input = $('#cmt-input'); const text = (input?.value||'').trim();
    if(!text){ toast('评论不能为空'); return; }
    p.comments = p.comments || [];
    p.comments.push({user:S.user.name, text, time:'刚刚', ts:Date.now()});
    save(); render(); toast('评论已发布');
  },
  'import-txt'(){ pickTxt(); },
  'source-toggle'(el){
    S.sourceOn = S.sourceOn || {};
    const id = el.dataset.id;
    S.sourceOn[id] = (S.sourceOn[id] === false);
    save(); render();
  },
  'add-source'(){
    modal(`<h4>添加书源</h4>
      <p style="text-align:left">演示版不内置第三方站点抓取。真实接入需要：<br>
      1）在服务端实现 <b>搜索/目录/正文</b> 三条规则；<br>
      2）提供 <b>/api/proxy</b> 转发请求以绕开同源限制；<br>
      3）把规则以 JSON 下发到「书源管理」。<br>详见同目录 README。</p>
      <div class="acts"><button class="btn primary" data-act="close-modal">明白了</button></div>`);
  },
  'clear-cache'(){
    modal(`<h4>清除缓存</h4>
      <p>将清空书架、阅读进度与社区帖子，且无法恢复。确定继续？</p>
      <div class="acts">
        <button class="btn line" data-act="close-modal">取消</button>
        <button class="btn primary" data-act="clear-confirm">确定清除</button>
      </div>`);
  },
  'clear-confirm'(){
    ttsStop(); Store.clear();
    S = defaultState(); save(); closeModal(); render();
    toast('已恢复初始状态');
  },
  'close-modal'(){ closeModal(); }
};

/* 点击统一分发 */
document.addEventListener('click', (e)=>{
    const el = e.target.closest('[data-act]');
    if(!el) return;
    const act = el.dataset.act;
    if(ACTIONS[act]){
      e.preventDefault();
      try{ ACTIONS[act](el, e); }catch(err){ console.error(err); }
    } else {
      console.warn('未处理的动作', act);
    }
}, true);

/* 回车搜索 + 阅读器方向键 */
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    const t = e.target;
    if(t && t.id === 'q'){ doSearch(t.value); }
    if(t && t.id === 'cmt-input'){ ACTIONS['send-comment']({dataset:{id:S.postId}}); }
  }
  if(S.view === 'reader'){
    if(e.key === 'ArrowRight') window.__nextChapter();
    if(e.key === 'ArrowLeft') window.__prevChapter();
    if(e.key === 'Escape') ACTIONS['close-reader']();
  }
});

/* 亮度滑杆实时调整 */
document.addEventListener('input', (e)=>{
  const el = e.target.closest('[data-act="set-bright"]');
  if(el) ACTIONS['set-bright'](el);
});

/* 退出时保存阅读时长（按页面停留估算） */
let enterTs = Date.now();
setInterval(()=>{
  if(S.view === 'reader') S.readSeconds = (S.readSeconds||0) + 30;
}, 30000);
window.addEventListener('beforeunload', ()=>{ save(); });

/* ==========================================================================
   启动
   ========================================================================== */
(function init(){
  checkHealth().then(v => {
    if(v){ render(); if(S.view === 'search' && S.query) liveSearch(S.query); }
  });
  applyFontPrefs();
  // 冷启动只回到四个一级页面，避免直接落进阅读器/帖子等二级页
  const TABS = ['home','shelf','community','me'];
  if(!TABS.includes(S.view)) S.view = 'home';
  if(!TABS.includes(S.tab)) S.tab = S.view;
  render();
  // 首次访问提示
  if(!Store.get()){
    setTimeout(()=>toast('欢迎使用愉阅 · 演示书库已就绪'), 600);
  }
})();
</script>
</body>
</html>
